<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Picking LIS-DHV</title>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Picking LIS-DHV">
<meta name="color-scheme" content="light">
<style>
  :root{
    color-scheme: light;
    --bg: #F7F5F1;
    --panel: #FFFFFF;
    --ink: #1B1B18;
    --ink-soft: #6B6459;
    --line: #DCD5C9;
    --accent: #D9531E;      /* naranja almacén */
    --accent-ink: #FFFFFF;
    --ok: #0F5257;          /* verde-azulado, entregado/completo */
    --warn-bg: #FCEFC7;
    --warn-ink: #7A5B00;
    --warn-edge: #E8B93B;
    --mono: 'SF Mono', 'Menlo', 'Consolas', monospace;
  }

  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ margin:0; padding:0; background:var(--bg); color:var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body{ padding-bottom: 40px; }

  /* ---- cabecera ---- */
  header{
    background: var(--ink);
    color: #F7F5F1;
    padding: 14px 18px;
    display:flex; align-items:center; justify-content:space-between;
    position: sticky; top:0; z-index:20;
  }
  header .brand{ display:flex; flex-direction:column; line-height:1.1; }
  header .brand b{ font-size:17px; letter-spacing:0.2px; }
  header .brand span{ font-size:11px; color:#B9B2A4; margin-top:2px; }
  header .user{
    font-family: var(--mono); font-size:13px;
    background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.18);
    padding:6px 10px; border-radius:3px; cursor:pointer; color:#F7F5F1;
    max-width:140px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }

  main{ max-width: 480px; margin: 0 auto; padding: 18px; }

  /* ---- pantalla inicio ---- */
  .home-grid{ display:flex; flex-direction:column; gap:14px; margin-top:8px; }
  .home-btn{
    background: var(--panel);
    border: 1px solid var(--line);
    border-left: 6px solid var(--accent);
    border-radius: 4px;
    padding: 20px 18px;
    text-align:left;
    cursor:pointer;
    display:flex; flex-direction:column; gap:4px;
  }
  .home-btn.alt{ border-left-color: var(--ok); }
  .home-btn b{ font-size:17px; }
  .home-btn span{ font-size:13px; color:var(--ink-soft); }
  .home-btn:active{ transform: scale(0.99); }

  .pending-strip{
    margin-top: 22px;
  }
  .pending-strip h3{
    font-size:12px; text-transform:uppercase; letter-spacing:0.06em;
    color:var(--ink-soft); margin: 0 0 8px 2px; font-weight:600;
  }

  /* ---- ficha de picking (tipo etiqueta de envío) ---- */
  .ticket{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 14px 14px 12px;
    margin-bottom: 10px;
    position: relative;
    cursor: pointer;
  }
  .ticket::before{
    content:"";
    position:absolute; left:0; top:10px; bottom:10px; width:3px;
    background: var(--line);
  }
  .ticket.attn::before{ background: var(--warn-edge); }
  .ticket-top{ display:flex; justify-content:space-between; align-items:baseline; }
  .ticket-of{ font-family: var(--mono); font-size:15px; font-weight:600; }
  .ticket-date{ font-size:11px; color:var(--ink-soft); }
  .ticket-proj{ font-size:13px; color:var(--ink-soft); margin-top:2px; }
  .ticket-meta{ display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; }
  .chip{
    font-size:11px; padding:3px 8px; border-radius:3px;
    border:1px solid var(--line); color:var(--ink-soft);
  }
  .chip.on{ border-color:var(--accent); color:var(--accent); font-weight:600; }
  .chip.attn{ background:var(--warn-bg); border-color:var(--warn-edge); color:var(--warn-ink); font-weight:600; }
  .chip.done{ background:var(--ok); border-color:var(--ok); color:#fff; font-weight:600; }

  .empty{
    text-align:center; color:var(--ink-soft); font-size:13px;
    padding: 24px 10px; border: 1px dashed var(--line); border-radius:4px;
  }

  /* ---- formularios ---- */
  .screen-title{
    display:flex; align-items:center; gap:10px; margin-bottom:16px;
  }
  .back{
    font-size:26px; font-weight:700; color:var(--ink);
    background:none; border:none; cursor:pointer; padding:4px 10px 4px 0; line-height:1;
  }
  .screen-title h2{ font-size:19px; margin:0; }

  label{
    display:block; font-size:12px; font-weight:700; color: var(--ink);
    text-transform:uppercase; letter-spacing:0.04em;
    margin: 16px 0 6px;
  }
  input[type=text], input[type=number], textarea, select{
    width:100%; padding:12px 12px; font-size:16px;
    border:1.5px solid #C7BFB0; border-radius:4px;
    background: var(--panel); color:var(--ink); font-family: inherit;
  }
  input[type=text].mono{ font-family: var(--mono); }
  textarea{ resize: vertical; min-height: 64px; }

  .row2{ display:flex; gap:10px; }
  .row2 > div{ flex:1; }

  .check-row{
    display:flex; gap:8px; margin-top:6px; flex-wrap:wrap;
  }
  .check-pill{
    flex:1 1 28%; text-align:center; padding:12px 6px; border-radius:4px;
    border:1px solid var(--line); font-size:14px; font-weight:600;
    color: var(--ink-soft); cursor:pointer; user-select:none;
  }
  .check-pill.active{
    border-color: var(--ink); border-width: 2px; background: var(--panel); color: var(--ink); font-weight:700;
  }
  .check-pill.active::before{ content: "✓ "; }
  .check-pill.add{
    border-style: dashed; border-color: var(--accent); color: var(--accent);
  }
  .quitar-extra{
    display:inline-block; margin-left:6px; color:#B33A3A; font-weight:700;
  }

  .entrega-item-toggle{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:12px 14px; margin-top:8px;
    border:1.5px solid var(--line); border-radius:6px; background:var(--panel);
    font-size:14px; font-weight:600; color:var(--ink); cursor:pointer; user-select:none;
  }
  .entrega-item-estado{ font-size:13px; font-weight:700; color: var(--ink-soft); }
  .entrega-item-toggle.item-pend{ border-color:#D98A1E; background:#FFF6E8; }
  .entrega-item-toggle.item-pend .entrega-item-estado{ color:#9A5B00; }
  .entrega-item-toggle.item-ok{ border-color:#1F7A52; background:#EAF6EF; }
  .entrega-item-toggle.item-ok .entrega-item-estado{ color:#155C3D; }

  .ubic-item{
    margin-top: 12px; padding: 14px 14px 12px;
    background: #FAF8F4; border: 1px solid var(--line); border-radius: 8px;
  }
  .ubic-nombre{
    font-size: 14px; font-weight: 700; color: var(--ink);
    display:block; margin-bottom: 10px;
  }
  .ubic-grid{
    display:grid; grid-template-columns: 1fr 1fr; gap: 8px;
  }
  .loc-chip{
    padding: 11px 8px; border-radius: 20px; border: 1.5px solid var(--line);
    background: #fff; font-size: 13px; font-weight: 600; color: var(--ink-soft);
    text-align:center; cursor:pointer; user-select:none; line-height:1.25;
  }
  .loc-chip.active{
    border-color: var(--ink); border-width: 2px; color: var(--ink); font-weight:700; background:#fff;
  }
  .loc-chip.active::before{ content: "✓ "; }
  .loc-chip.add{
    grid-column: 1 / -1;
    border-style: dashed; border-color: var(--accent); color: var(--accent); font-weight:600;
  }

  .btn{
    width:100%; padding:14px; font-size:15px; font-weight:600;
    border-radius:4px; border:none; cursor:pointer; margin-top:22px;
  }
  .btn-primary{ background: var(--accent); color: var(--accent-ink); }
  .btn-primary:active{ opacity:0.9; }
  .btn-ok{ background: var(--ok); color: #fff; }
  .btn-outline{
    background: var(--panel); color: var(--ink); border:1px solid var(--line);
  }

  .hint{ font-size:12px; color:var(--ink-soft); margin-top:6px; }

  /* ---- detalle / entrega ---- */
  .detail-block{
    background:var(--panel); border:1px solid var(--line); border-radius:4px;
    padding:16px; margin-bottom:14px;
  }
  .detail-of{ font-family:var(--mono); font-size:20px; font-weight:700; }
  .detail-sub{ font-size:13px; color:var(--ink-soft); margin-top:2px; }
  .detail-grid{ display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }

  .attn-banner{
    background: var(--warn-bg); border:1px solid var(--warn-edge);
    color: var(--warn-ink); border-radius:4px; padding:12px 14px;
    font-size:13px; font-weight:600; margin-bottom:14px;
    display:flex; gap:8px; align-items:flex-start;
  }
  .attn-banner .dot{ font-size:16px; line-height:1; }

  .sign-banner{
    background: #FFF3EC; border:2px solid var(--accent);
    color: #7A2E0E; border-radius:4px; padding:14px;
    font-size:13px; font-weight:600; margin: 16px 0 4px;
  }
  .sign-banner label{
    display:flex; gap:10px; align-items:flex-start; cursor:pointer;
    margin:0; text-transform:none; font-size:13px; letter-spacing:normal; color:#7A2E0E;
  }
  .sign-banner input[type=checkbox]{
    width:22px; height:22px; margin-top:1px; flex-shrink:0; accent-color: var(--accent);
  }
  .btn:disabled{ opacity:0.45; cursor:not-allowed; }

  .done-banner{
    background: #EAF4F1; border:1px solid var(--ok);
    color: var(--ok); border-radius:4px; padding:12px 14px;
    font-size:13px; font-weight:600; margin-bottom:14px;
    display:flex; gap:8px; align-items:flex-start;
  }
  .done-banner .dot{ font-size:16px; line-height:1; }
  .done-banner span.txt{ color: #103D38; font-weight:500; }
  .done-banner b{ font-weight:700; }

  .obs-box{
    font-size:13px; color:var(--ink); background:#FAF8F4;
    border:1px solid var(--line); border-radius:4px; padding:10px 12px; margin-top:10px;
  }

  .entrega-log{ margin-top:6px; }
  .entrega-log .item{
    font-size:12px; color:var(--ink-soft); padding:8px 0;
    border-top:1px solid var(--line);
  }
  .entrega-log .item b{ color:var(--ink); }
  .entrega-log .item .undo{
    display:inline-block; margin-top:5px; font-size:11px; font-weight:700;
    color: var(--accent); cursor:pointer;
  }

  .status-tag{
    display:inline-block; font-size:11px; font-weight:700;
    padding:3px 9px; border-radius:3px; text-transform:uppercase; letter-spacing:0.04em;
  }
  .status-tag.pend{ background:#F3EFE6; color:var(--ink-soft); }
  .status-tag.done{ background:var(--ok); color:#fff; }

  /* ---- modal simple ---- */
  .overlay{
    position:fixed; inset:0; background:rgba(20,18,14,0.5);
    display:flex; align-items:flex-end; justify-content:center; z-index:50;
  }
  .sheet{
    background:var(--panel); width:100%; max-width:480px;
    border-radius: 12px 12px 0 0; padding:20px;
    max-height:85vh; overflow-y:auto;
  }
  .sheet h3{ margin:0 0 14px; font-size:17px; }

  .name-pill{
    display:inline-block; padding:9px 14px; border-radius:20px;
    border:1px solid var(--line); font-size:14px; margin:0 6px 8px 0; cursor:pointer;
  }
  .name-pill.sel{ background:var(--ink); color:#fff; border-color:var(--ink); }


  .toast{
    position:fixed; bottom:18px; left:50%; transform:translateX(-50%);
    background: var(--ink); color:#fff; padding:10px 18px; border-radius:20px;
    font-size:13px; z-index:100; opacity:0; pointer-events:none; transition:opacity .2s;
  }
  .toast.show{ opacity:1; }

  .screen{ display:none; }
  .screen.active{ display:block; }

  /* ---- adaptación a pantallas grandes (PC) ---- */
  @media (min-width: 720px){
    main{ max-width: 760px; padding: 28px 24px; }

    .home-grid{ flex-direction: row; }
    .home-btn{ flex:1; padding: 26px 20px; }

    .pending-strip #pendingList,
    #buscarResultado{
      display:grid; grid-template-columns: 1fr 1fr; gap:12px;
    }
    .pending-strip #pendingList .ticket,
    #buscarResultado .ticket{ margin-bottom:0; }

    .overlay{ align-items:center; }
    .sheet{ border-radius:12px; max-width:440px; margin:0 16px; }

    .row2{ gap:16px; }

    .detail-block{ padding:22px; }
  }
</style>
</head>
<body>

<header>
  <div class="brand"><b>Picking LIS-DHV</b><span>Registro y entrega</span></div>
  <div class="user" id="userChip" onclick="abrirCambioUsuario()">Identificarse</div>
</header>

<main>

  <!-- ============ HOME ============ -->
  <section class="screen active" id="screen-home">
    <div class="home-grid">
      <button class="home-btn" onclick="nuevoPicking()">
        <b>📦 Registrar picking</b>
        <span>Nuevo picking hecho: OF, cajas y qué lleva fuera</span>
      </button>
      <button class="home-btn alt" onclick="ir('buscar')">
        <b>🔍 Buscar / Entregar</b>
        <span>Buscar una OF y registrar su entrega</span>
      </button>
    </div>
  </section>

  <!-- ============ REGISTRO ============ -->
  <section class="screen" id="screen-registro">
    <div class="screen-title">
      <button class="back" onclick="ir('home')">←</button>
      <h2 id="formTitle">Registrar picking</h2>
    </div>

    <label>OF</label>
    <input type="text" class="mono" id="f_of" placeholder="Ej. 20260912">

    <div class="row2">
      <div>
        <label>Proyecto</label>
        <input type="text" id="f_proyecto" placeholder="Ej. 2024-275">
      </div>
      <div>
        <label>Subproyecto</label>
        <input type="text" id="f_subproyecto" placeholder="Opcional">
      </div>
    </div>

    <label>Nº de cajas</label>
    <input type="number" id="f_cajas" min="1" value="1" inputmode="numeric" oninput="renderUbicacionPills()">

    <label>Lleva fuera de la caja</label>
    <div class="check-row" id="fueraRow"></div>

    <label>Ubicación</label>
    <div id="ubicacionesContainer"></div>

    <label>Observaciones</label>
    <textarea id="f_obs" placeholder="Cualquier detalle útil para quien entregue después"></textarea>

    <button class="btn btn-primary" onclick="guardarPicking()" id="btnGuardarPicking">Registrar picking</button>
  </section>

  <!-- ============ BUSCAR ============ -->
  <section class="screen" id="screen-buscar">
    <div class="screen-title">
      <button class="back" onclick="ir('home')">←</button>
      <h2>Buscar OF</h2>
    </div>

    <label>Nº de OF</label>
    <input type="text" class="mono" id="buscarInput" placeholder="Ej. 20260912" inputmode="numeric">
    <button class="btn btn-outline" onclick="buscarOF()">Buscar</button>

    <div id="buscarResultado" style="margin-top:20px;"></div>

    <button class="btn btn-outline" onclick="ir('pendientes')" style="margin-top:28px;">📋 Ver pendientes de entrega</button>
  </section>

  <!-- ============ PENDIENTES ============ -->
  <section class="screen" id="screen-pendientes">
    <div class="screen-title">
      <button class="back" onclick="ir('buscar')">←</button>
      <h2>Pendientes de entrega</h2>
    </div>
    <button class="btn btn-outline" onclick="actualizarPendientes()" id="btnActualizarPendientes">🔄 Actualizar</button>
    <div class="pending-strip">
      <div id="pendingList"></div>
    </div>
  </section>

  <!-- ============ DETALLE / ENTREGA ============ -->
  <section class="screen" id="screen-detalle">
    <div class="screen-title">
      <button class="back" onclick="ir('buscar')">←</button>
      <h2>Detalle de la OF</h2>
    </div>
    <div id="detalleContenido"></div>
  </section>

</main>

<div class="toast" id="toast"></div>

<script>
/* =========================================================
   MODELO DE DATOS — conectado a Google Sheets vía Apps Script.
   Fuente de verdad: la Sheet. sincronizar() la lee entera y
   reconstruye DB; cada acción de escritura llama a
   llamarBackend() y luego vuelve a sincronizar().
   ========================================================= */

const GAS_URL = 'https://script.google.com/macros/s/AKfycbyqtIAwqXrpPTqgiPCiSs_rkpYgLMSEY_NPpNMBVozrqz8UvpWF37Kx8VFflRxVyMu1wQ/exec';
const LS_USER = 'pickings_lis_usuario';

async function fetchConLimite(url, opciones, msLimite){
  const controller = new AbortController();
  const timeoutId = setTimeout(()=>controller.abort(), msLimite || 15000);
  try{
    const res = await fetch(url, { ...(opciones||{}), signal: controller.signal });
    return res;
  } finally {
    clearTimeout(timeoutId);
  }
}
async function llamarBackend(accion, datos){
  const res = await fetchConLimite(GAS_URL, {
    method: 'POST',
    headers: {'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({ accion, datos })
  }, 15000);
  return res.json();
}
async function cargarDesdeSheet(){
  const res = await fetchConLimite(GAS_URL, {}, 25000);
  return res.json();
}

function formatFuera(obj){
  return Object.keys(obj||{}).filter(k=>obj[k]).join(', ');
}
function parseFuera(str){
  const out = {};
  (str||'').split(',').map(s=>s.trim()).filter(Boolean).forEach(k=> out[k]=true);
  return out;
}
function formatUbicaciones(obj){
  return Object.entries(obj||{}).map(([k,v])=>`${k}: ${v}`).join(', ');
}
function parseUbicaciones(str){
  const out = {};
  (str||'').split(',').map(s=>s.trim()).filter(Boolean).forEach(part=>{
    const idx = part.indexOf(':');
    if(idx===-1) return;
    const k = part.slice(0,idx).trim();
    const v = part.slice(idx+1).trim();
    if(k) out[k]=v;
  });
  return out;
}

function construirPickingDesdeRow(row, entregas, historial, previo){
  const id = row['ID'];
  const entregasDe = entregas.filter(e=>e['ID del picking']===id).map(e=>({
    tipo: e['Tipo'], entregadoPor: e['Entregado por'], entregadoA: e['Entregado a'],
    nota: e['Nota'] || '', fecha: e['Fecha']
  }));
  let ediciones, deshechas;
  if(historial){
    const historialDe = historial.filter(h=>h['ID del picking']===id);
    ediciones = historialDe.filter(h=>h['Tipo']==='Edición').map(h=>({
      editadoPor: h['Autor'], fecha: h['Fecha'], motivo: h['Motivo'] || '',
      cambios: h['Detalle'] ? h['Detalle'].split(' · ').filter(Boolean) : []
    }));
    deshechas = historialDe.filter(h=>h['Tipo']==='Entrega deshecha').map(h=>({
      hechoPor: h['Autor'], fecha: h['Fecha'], motivo: h['Motivo'] || '',
      detalleTexto: h['Detalle'] || ''
    }));
  } else {
    // carga ligera: no se pidió Historial — se conserva lo que ya había en memoria
    ediciones = previo ? previo.ediciones : [];
    deshechas = previo ? previo.deshechas : [];
  }
  return {
    id,
    of: String(row['OF'] || ''),
    proyecto: String(row['Proyecto'] || ''),
    subproyecto: String(row['Subproyecto'] || ''),
    cajas: Number(row['Cajas']) || 1,
    fuera: parseFuera(row['Fuera de la caja']),
    ubicaciones: parseUbicaciones(row['Ubicaciones']),
    observaciones: row['Observaciones'] || '',
    registradoPor: row['Registrado por'] || '',
    fecha: row['Fecha'],
    estado: row['Estado'] || 'pendiente',
    entregas: entregasDe,
    ediciones,
    deshechas
  };
}

function construirDB(datos){
  const entregas = datos.entregas || [];
  const historial = datos.historial || [];
  return (datos.pickings || []).map(row=> construirPickingDesdeRow(row, entregas, historial));
}

function procesarDatos(datos){
  usuariosRemotos = datos.usuarios || [];
  DB = construirDB(datos);

  if(usuarioActual && !usuariosRemotos.some(u=>normalizarNombre(u['Nombre'])===normalizarNombre(usuarioActual))){
    usuarioActual = '';
    localStorage.removeItem(LS_USER);
    adminUnlocked = false;
    actualizarChipUsuario();
    cerrarSheet();
    toast('Tu usuario ya no existe en la hoja');
    setTimeout(()=>abrirCambioUsuario(true), 300);
    return false;
  }
  return true;
}

function refrescarPantalla(){
  const activa = document.querySelector('.screen.active');
  if(!activa) return;
  if(activa.id === 'screen-buscar'){
    const v = document.getElementById('buscarInput').value;
    if(v) buscarOF();
  }
  if(activa.id === 'screen-pendientes') renderPendientes();
  if(activa.id === 'screen-detalle' && ofEnDetalle){
    const p = DB.find(x=>x.id===ofEnDetalle);
    if(p) document.getElementById('detalleContenido').innerHTML = detalleHtml(p);
  }
}

// Usar cuando NO hay datos ya frescos a mano: pide todo de nuevo a la Sheet.
async function sincronizar(){
  const datos = await cargarDesdeSheet();
  if(!procesarDatos(datos)) return;
  refrescarPantalla();
}

const LS_EXTRAS = 'pickings_lis_extras_fuera';
const FUERA_BASE = ['Plantillas','Perfiles','Cables'];
const LS_EXTRAS_UBIC = 'pickings_lis_extras_ubicacion';
const UBICACION_BASE = ['Carpa','Almacén','Estantería de perfiles','Estantería de plantillas','Sala limpia'];

function claveNombre(n){
  return (n||'').trim().toLowerCase();
}
function normalizarNombre(s){
  return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
}
function esAdminSheet(nombre){
  const u = usuariosRemotos.find(x=>claveNombre(x['Nombre'])===claveNombre(nombre));
  return !!(u && String(u['Admin']||'').trim());
}
function puedeGestionar(p){
  return esAdminSheet(usuarioActual) || normalizarNombre(usuarioActual) === normalizarNombre(p.registradoPor);
}
function pinDeUsuario(nombre){
  const u = usuariosRemotos.find(x=>claveNombre(x['Nombre'])===claveNombre(nombre));
  return u ? String(u['PIN']||'') : '';
}

function idTemporal(){
  return 'tmp_' + Date.now() + '_' + Math.random().toString(36).slice(2,7);
}

async function guardarPinUsuario(obligatorio){
  const val = document.getElementById('nuevoPinUsuario').value.trim();
  if(val.length !== 4){ toast('El PIN debe tener 4 números'); return; }

  // Se aplica ya mismo en local, sin esperar a Google — el guardado real
  // sigue por detrás, sin bloquear a la persona.
  usuariosRemotos = usuariosRemotos.filter(u=>claveNombre(u['Nombre'])!==claveNombre(usuarioActual));
  usuariosRemotos.push({ 'Nombre': usuarioActual, 'PIN': val });

  cerrarSheet();
  toast(obligatorio ? 'Listo, ya puedes usar la app' : 'PIN guardado');

  try{
    const resultado = await llamarBackend('guardarUsuario', { nombre: usuarioActual, pin: val, por: usuarioActual });
    if(resultado && resultado.usuarios) usuariosRemotos = resultado.usuarios;
  } catch(err){
    // si falla de verdad, la sincronización periódica ya lo reintentará
  }
}

/* ---------- sheet modal genérico ---------- */
function mostrarSheet(html, bloqueante){
  cerrarSheet();
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.id = 'sheetOverlay';
  if(!bloqueante){
    ov.onclick = (e)=>{ if(e.target===ov) cerrarSheet(); };
  }
  ov.innerHTML = `<div class="sheet" onclick="event.stopPropagation()">${html}</div>`;
  document.body.appendChild(ov);
}
function cerrarSheet(){
  const ov = document.getElementById('sheetOverlay');
  if(ov) ov.remove();
}

/* ---------- registro de picking ---------- */
function toggleFuera(el){
  const key = el.dataset.key;
  fueraSeleccion[key] = !fueraSeleccion[key];
  el.classList.toggle('active');
  renderUbicacionPills();
}
function renderFueraPills(){
  const extras = cargarExtrasFuera();
  const todas = FUERA_BASE.concat(extras);
  const row = document.getElementById('fueraRow');
  row.innerHTML = todas.map(label=>{
    const active = fueraSeleccion[label] ? 'active' : '';
    const esExtra = extras.includes(label);
    return `<div class="check-pill ${active}" data-key="${label}" onclick="toggleFuera(this)">
      ${label}${esExtra ? `<span class="quitar-extra" onclick="event.stopPropagation(); quitarExtraFuera('${label}')">✕</span>` : ''}
    </div>`;
  }).join('') + `<div class="check-pill add" onclick="abrirAnadirFuera()">+ Añadir</div>`;
}
function quitarExtraFuera(label){
  const extras = cargarExtrasFuera().filter(x=>x!==label);
  guardarExtrasFuera(extras);
  delete fueraSeleccion[label];
  renderFueraPills();
  renderUbicacionPills();
}
function abrirAnadirFuera(){
  mostrarSheet(`<h3>Añadir tipo de componente</h3>
    <label>Nombre</label>
    <input type="text" id="nuevaFuera" placeholder="Ej. Tornillería">
    <button class="btn btn-primary" onclick="confirmarAnadirFuera()">Añadir y marcar</button>`);
}
function confirmarAnadirFuera(){
  const val = document.getElementById('nuevaFuera').value.trim();
  if(!val) return;
  const extras = cargarExtrasFuera();
  if(!extras.includes(val) && !FUERA_BASE.includes(val)) extras.push(val);
  guardarExtrasFuera(extras);
  fueraSeleccion[val] = true;
  cerrarSheet();
  renderFueraPills();
  renderUbicacionPills();
  toast('Añadido: ' + val);
}

function renderUbicacionPills(){
  const cont = document.getElementById('ubicacionesContainer');
  const items = itemsParaUbicar();
  const opciones = UBICACION_BASE.concat(cargarExtrasUbicacion());
  const cajas = parseInt(document.getElementById('f_cajas').value) || 1;
  cont.innerHTML = items.map(item=>{
    const chips = opciones.map(op=>{
      const active = ubicacionesSeleccion[item] === op ? 'active' : '';
      return `<div class="loc-chip ${active}" data-item="${item}" data-label="${op}" onclick="toggleUbicacionItem(this)">${op}</div>`;
    }).join('') + `<div class="loc-chip add" onclick="abrirAnadirUbicacion('${item}')">+ Añadir otra</div>`;
    const titulo = item === 'Cajas' ? `Cajas de picking (${cajas})` : item;
    return `<div class="ubic-item">
      <span class="ubic-nombre">${titulo}</span>
      <div class="ubic-grid">${chips}</div>
    </div>`;
  }).join('');
}
function itemsParaUbicar(){
  const items = ['Cajas'];
  Object.keys(fueraSeleccion).forEach(k=>{ if(fueraSeleccion[k]) items.push(k); });
  return items;
}
function toggleUbicacionItem(el){
  const item = el.dataset.item;
  const label = el.dataset.label;
  ubicacionesSeleccion[item] = label;
  document.querySelectorAll(`#ubicacionesContainer .loc-chip[data-item="${item}"]`).forEach(p=>p.classList.remove('active'));
  el.classList.add('active');
}
function abrirAnadirUbicacion(item){
  itemPendienteUbicacion = item;
  mostrarSheet(`<h3>Añadir ubicación para "${item}"</h3>
    <label>Nombre</label>
    <input type="text" id="nuevaUbicacion" placeholder="Ej. Sala limpia — zona 2">
    <button class="btn btn-primary" onclick="confirmarAnadirUbicacion()">Añadir y elegir</button>`);
}
function confirmarAnadirUbicacion(){
  const val = document.getElementById('nuevaUbicacion').value.trim();
  if(!val || !itemPendienteUbicacion) return;
  const extras = cargarExtrasUbicacion();
  if(!extras.includes(val) && !UBICACION_BASE.includes(val)) extras.push(val);
  guardarExtrasUbicacion(extras);
  ubicacionesSeleccion[itemPendienteUbicacion] = val;
  cerrarSheet();
  renderUbicacionPills();
  toast('Añadido: ' + val);

async function actualizarPendientes(){
  const btn = document.getElementById('btnActualizarPendientes');
  if(btn){ btn.disabled = true; btn.textContent = 'Actualizando…'; }
  try{
    const res = await fetchConLimite(GAS_URL + '?ligero=1', {}, 25000);
    const datos = await res.json();
    const entregas = datos.entregas || [];
    const anteriores = {};
    DB.forEach(p=>{ anteriores[p.id] = p; });
    DB = (datos.pickings || []).map(row=> construirPickingDesdeRow(row, entregas, null, anteriores[row['ID']]));
    renderPendientes();
  } catch(err){
    toast('No se pudo actualizar: ' + (err && err.message ? err.message : 'error desconocido'));
    renderPendientes();
  }
  if(btn){ btn.disabled = false; btn.textContent = '🔄 Actualizar'; }
}

function abrirEdicion(id){
  const p = DB.find(x=>x.id===id);
  if(!p) return;
  if(!puedeGestionar(p)){ toast('Solo quien registró este picking, o un administrador, pueden editarlo'); return; }
  editingId = id;
  ir('registro');
  document.getElementById('f_of').value = p.of;
  document.getElementById('f_proyecto').value = p.proyecto;
  document.getElementById('f_subproyecto').value = p.subproyecto;
  document.getElementById('f_cajas').value = p.cajas;
  document.getElementById('f_obs').value = p.observaciones;
  fueraSeleccion = {...p.fuera};
  renderFueraPills();
  ubicacionesSeleccion = {...(p.ubicaciones||{})};
  renderUbicacionPills();
  document.getElementById('formTitle').textContent = 'Editar picking';
  document.getElementById('btnGuardarPicking').textContent = 'Guardar cambios';
}

let pendienteRegistro = null;

async function guardarPicking(){
  if(!usuarioActual){ abrirCambioUsuario(); toast('Primero identifícate'); return; }
  const of = document.getElementById('f_of').value.trim();
  const proyecto = document.getElementById('f_proyecto').value.trim();
  const subproyecto = document.getElementById('f_subproyecto').value.trim();
  const cajas = parseInt(document.getElementById('f_cajas').value) || 1;
  const obs = document.getElementById('f_obs').value.trim();

  if(!of){ toast('Falta el número de OF'); return; }
  const itemsFaltan = itemsParaUbicar().filter(it=>!ubicacionesSeleccion[it]);
  if(itemsFaltan.length){ toast('Falta elegir dónde va: ' + itemsFaltan.join(', ')); return; }

  const ubicacionesFinal = {};
  itemsParaUbicar().forEach(it=> ubicacionesFinal[it] = ubicacionesSeleccion[it]);

  if(editingId){
    pedirMotivoEdicion({ of, proyecto, subproyecto, cajas, obs, fuera: {...fueraSeleccion}, ubicaciones: ubicacionesFinal });
    return;
  }

  const datosNuevos = {
    of, proyecto, subproyecto, cajas,
    fuera: formatFuera(fueraSeleccion),
    ubicaciones: formatUbicaciones(ubicacionesFinal),
    observaciones: obs,
    registradoPor: usuarioActual,
    fecha: new Date().toISOString()
  };

  mostrarConfirmacionRegistro(datosNuevos);
}

      <div style="font-size:12px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.06em;">OF</div>

    </div>
    <p style="font-size:14px; color:var(--ink-soft); text-align:center; margin:0 0 4px;">
      Proyecto <b style="color:var(--ink);">${datos.proyecto || '—'}</b>${datos.subproyecto ? ` · FM <b style="color:var(--ink);">${datos.subproyecto}</b>` : ''}
    </p>
    <p style="font-size:12px; color:var(--ink-soft); text-align:center; margin:10px 0 4px;">Revisa bien el número de OF antes de confirmar.</p>
    <button class="btn btn-primary" onclick="confirmarPasoRegistro()">✓ Está bien, registrar</button>
    <button class="btn btn-outline" onclick="cerrarSheet()">Revisar datos</button>
  `);
}

function confirmarPasoRegistro(){
  if(!pendienteRegistro) return;
  const datos = pendienteRegistro;
  cerrarSheet();

  const ofNormalizada = datos.of.trim().toLowerCase();
  const existente = DB.find(p=>p.of.trim().toLowerCase()===ofNormalizada);
  if(existente){
    mostrarSheet(`
      <h3>⚠️ Esta OF ya está registrada</h3>
      <p style="font-size:14px; color:var(--ink-soft); margin:0 0 10px;">
        <b>${existente.registradoPor}</b> ya registró un picking con la OF <b>${datos.of}</b> el ${fechaCorta(existente.fecha)}${existente.estado==='completado' ? ' (ya entregada)' : ''}.
      </p>
      <label>¿Por qué necesitas registrarla otra vez?</label>
      <textarea id="motivoDuplicado" placeholder="Ej. Es una reposición aparte de la misma OF" oninput="document.getElementById('btnConfirmarDuplicado').disabled = !this.value.trim()"></textarea>
      <button class="btn btn-primary" id="btnConfirmarDuplicado" style="background:#B33A3A;" onclick="confirmarRegistroDuplicado()" disabled>Sí, registrar otro</button>
      <button class="btn btn-outline" onclick="cerrarSheet()">Cancelar</button>
    `);
    return;
  }

  ejecutarCrearPicking(datos);
  pendienteRegistro = null;
}

async function confirmarRegistroDuplicado(){
  if(!pendienteRegistro) return;
  const motivo = document.getElementById('motivoDuplicado').value.trim();
  if(!motivo) return;
  pendienteRegistro.observaciones = `[OF repetida — ${motivo}] ${pendienteRegistro.observaciones || ''}`.trim();
  cerrarSheet();
  await ejecutarCrearPicking(pendienteRegistro);
  pendienteRegistro = null;
}

async function ejecutarCrearPicking(datos){
  // Aparece en Inicio al instante; el guardado real va por detrás.
  const optimista = {
    id: idTemporal(),
    of: datos.of, proyecto: datos.proyecto, subproyecto: datos.subproyecto,
    cajas: datos.cajas,
    fuera: parseFuera(datos.fuera),
    ubicaciones: parseUbicaciones(datos.ubicaciones),
    observaciones: datos.observaciones,
    registradoPor: datos.registradoPor,
    fecha: datos.fecha,
    estado: 'pendiente',
    entregas: [], ediciones: [], deshechas: []
  };
  DB.unshift(optimista);
  toast('Picking registrado');
  ir('home');

  try{
    await llamarBackend('crearPicking', datos);
  } catch(err){
    // no molestamos aquí; la sincronización de fondo ya se encarga
  }
  sincronizar().catch(()=>{});
}

function diffCambios(p, nuevo){
  const cambios = [];
  if(p.of !== nuevo.of) cambios.push(`OF: ${p.of} → ${nuevo.of}`);
  if((p.proyecto||'') !== nuevo.proyecto) cambios.push(`Proyecto: ${p.proyecto||'—'} → ${nuevo.proyecto||'—'}`);
  if((p.subproyecto||'') !== nuevo.subproyecto) cambios.push(`Subproyecto: ${p.subproyecto||'—'} → ${nuevo.subproyecto||'—'}`);
  if(p.cajas !== nuevo.cajas) cambios.push(`Cajas: ${p.cajas} → ${nuevo.cajas}`);
  if((p.observaciones||'') !== nuevo.obs) cambios.push('Observaciones actualizadas');
  const ubicAntes = p.ubicaciones || {};
  const ubicDespues = nuevo.ubicaciones || {};
  Array.from(new Set([...Object.keys(ubicAntes), ...Object.keys(ubicDespues)])).forEach(k=>{
    if((ubicAntes[k]||'—') !== (ubicDespues[k]||'—')) cambios.push(`Ubicación ${k}: ${ubicAntes[k]||'—'} → ${ubicDespues[k]||'—'}`);
  });
  const antes = Object.keys(p.fuera||{}).filter(k=>p.fuera[k]);
  const despues = Object.keys(nuevo.fuera||{}).filter(k=>nuevo.fuera[k]);
  const añadidos = despues.filter(k=>!antes.includes(k));
  const quitados = antes.filter(k=>!despues.includes(k));
  if(añadidos.length) cambios.push(`+ Añadido: ${añadidos.join(', ')}`);
  if(quitados.length) cambios.push(`− Quitado: ${quitados.join(', ')}`);
  return cambios;
}

async function confirmarEdicion(){
  const p = DB.find(x=>x.id===editingId);
  if(!p || !pendienteEdicion) return;
  const motivo = document.getElementById('motivoEdicion').value.trim();
  const cambios = diffCambios(p, pendienteEdicion);

  const datosEnvio = {
    id: p.id,
    of: pendienteEdicion.of,
    proyecto: pendienteEdicion.proyecto,
    subproyecto: pendienteEdicion.subproyecto,
    cajas: pendienteEdicion.cajas,
    fuera: formatFuera(pendienteEdicion.fuera),
    ubicaciones: formatUbicaciones(pendienteEdicion.ubicaciones),
    observaciones: pendienteEdicion.obs,
    editadoPor: usuarioActual,
    motivo,
    cambios
  };

  // aplicar ya mismo en local
  p.of = pendienteEdicion.of;
  p.proyecto = pendienteEdicion.proyecto;
  p.subproyecto = pendienteEdicion.subproyecto;
  p.cajas = pendienteEdicion.cajas;
  p.fuera = pendienteEdicion.fuera;
  p.ubicaciones = pendienteEdicion.ubicaciones;
  p.observaciones = pendienteEdicion.obs;
  if(!p.ediciones) p.ediciones = [];
  p.ediciones.push({ editadoPor: usuarioActual, fecha: new Date().toISOString(), motivo, cambios });

  cerrarSheet();
  pendienteEdicion = null;
  toast('Cambios guardados');
  abrirDetalle(p.id);

  try{
    await llamarBackend('editarPicking', datosEnvio);
  } catch(err){}
  sincronizar().catch(()=>{});
}

/* ---------- pendientes en home ---------- */
function compararPendientes(a,b){
  const porProyecto = String(a.proyecto||'').localeCompare(String(b.proyecto||''), 'es', {numeric:true, sensitivity:'base'});
  if(porProyecto !== 0) return porProyecto;
  const porOF = String(a.of||'').localeCompare(String(b.of||''), 'es', {numeric:true, sensitivity:'base'});
  if(porOF !== 0) return porOF;
  return String(a.subproyecto||'').localeCompare(String(b.subproyecto||''), 'es', {numeric:true, sensitivity:'base'});
}
function renderPendientes(){
  const cont = document.getElementById('pendingList');
  const pendientes = DB.filter(p=>p.estado!=='completado').sort(compararPendientes);
  if(pendientes.length===0){
    cont.innerHTML = `<div class="empty">No hay pickings pendientes de entrega</div>`;
    return;
  }
  cont.innerHTML = pendientes.map(p=>ticketHtml(p)).join('');
}

function parsearItemsEntrega(nota){
  const m = (nota||'').match(/^\[(.*?)\]\s*/);
  if(!m) return { items: [], notaLimpia: nota||'' };
  const items = m[1].split('|').map(par=>{
    const [nombre, estado] = par.split(':');
    return { nombre: (nombre||'').trim(), estado: (estado||'').trim() };
  }).filter(x=>x.nombre);
  return { items, notaLimpia: (nota||'').slice(m[0].length) };
}
function chipsEstadoItems(items){
  const iconos = { pendiente:'🟠', completado:'🟢' };
  return items.map(it=>`<span class="chip ${it.estado==='completado'?'on':'attn'}">${iconos[it.estado]||''} ${it.nombre}</span>`).join('');
}
function resumenSemaforo(p){
  const estados = {};
  fueraActivas(p).forEach(nombre=> estados[nombre] = null); // registrados, aún sin tocar
  p.entregas.forEach(e=>{
    const { items } = parsearItemsEntrega(e.nota);
    items.forEach(it=> estados[it.nombre] = it.estado);
  });
  const claves = Object.keys(estados);
  if(!claves.length) return '';
  const iconos = { pendiente:'🟠', completado:'🟢' };
  const partes = claves.map(nombre=>{
    const estado = estados[nombre];
    const icono = estado ? iconos[estado] : '⚪';
    const etiqueta = estado==='completado' ? 'todo entregado' : estado==='pendiente' ? 'entregado parcial' : 'sin tocar';
    return `${icono} ${nombre} (${etiqueta})`;
  });
  return `<div class="obs-box" style="margin-top:10px;"><b>Estado por componente</b><br>${partes.join(' · ')}</div>`;
}

function fueraActivas(p){
  return Object.keys(p.fuera||{}).filter(k=>p.fuera[k]);
}
function tieneAtencion(p){
  return p.cajas > 1 || fueraActivas(p).length > 0 || !!p.observaciones;
}

function ticketHtml(p){
  const entregado = p.estado==='completado';
  const attn = !entregado && tieneAtencion(p);
  const chips = [];
  if(p.cajas>1) chips.push(`<span class="chip attn">${p.cajas} cajas</span>`);
  else chips.push(`<span class="chip">${p.cajas} caja</span>`);
  fueraActivas(p).forEach(k=> chips.push(`<span class="chip on">${k}</span>`));
  Object.entries(p.ubicaciones||{}).forEach(([k,v])=>{
    const etiqueta = k==='Cajas' ? `Cajas de picking (${p.cajas})` : k;
    chips.push(`<span class="chip">📍 ${etiqueta}: ${v}</span>`);
  });
  if(adminUnlocked && p.ediciones && p.ediciones.length) chips.push(`<span class="chip">✏️ Editado</span>`);
  if(adminUnlocked && p.deshechas && p.deshechas.length) chips.push(`<span class="chip attn">↩️ Entrega deshecha</span>`);
  if(entregado) chips.push(`<span class="chip done">Entregado</span>`);
  else if(p.entregas.length>0) chips.push(`<span class="chip attn">Entrega parcial</span>`);

  return `<div class="ticket ${attn?'attn':''}" onclick="abrirDetalle('${p.id}')">
    <div class="ticket-top">
      <span class="ticket-of">OF ${p.of}</span>
      <span class="ticket-date">${fechaCorta(p.fecha)}</span>
    </div>
    <div class="ticket-proj">${p.proyecto || '—'}${p.subproyecto ? ' · '+p.subproyecto : ''}</div>
    <div class="ticket-meta">${chips.join('')}</div>
  </div>`;
}

function fechaCorta(iso){
  const d = new Date(iso);
  return d.toLocaleDateString('es-ES', {day:'2-digit', month:'2-digit'}) + ' ' +
         d.toLocaleTimeString('es-ES', {hour:'2-digit', minute:'2-digit'});
}

/* ---------- buscar ---------- */
async function buscarOF(){
  const val = document.getElementById('buscarInput').value.trim();
  const cont = document.getElementById('buscarResultado');
  if(!val){ cont.innerHTML=''; return; }

  const buscar = ()=> DB.filter(p=>p.of.toLowerCase().includes(val.toLowerCase()))
                        .sort((a,b)=> new Date(b.fecha)-new Date(a.fecha));

  let resultados = buscar();
  if(resultados.length===0){
    // puede que se haya registrado hace un instante en otro móvil y aún no
    // haya llegado por la sincronización normal — se prueba una vez más.
    cont.innerHTML = `<div class="empty">Actualizando…</div>`;
    try{
      const datos = await cargarDesdeSheet();
      procesarDatos(datos);
    } catch(err){}
    resultados = buscar();
  }

  if(resultados.length===0){
    cont.innerHTML = `<div class="empty">No hay ningún picking con esa OF</div>`;
    return;
  }
  cont.innerHTML = resultados.map(p=>ticketHtml(p)).join('');
}

/* ---------- detalle + entrega ---------- */
function abrirDetalle(id){
  ofEnDetalle = id;
  const p = DB.find(x=>x.id===id);
  if(!p) return;
  ir('detalle');
  document.getElementById('detalleContenido').innerHTML = detalleHtml(p);
}

function detalleHtml(p){
  const entregado = p.estado==='completado';
  const attn = !entregado && tieneAtencion(p);
  let banner = '';
  if(attn){
    const motivos = [];
    if(p.cajas>1) motivos.push(`${p.cajas} cajas — recoger todas juntas`);
    fueraActivas(p).forEach(k=> motivos.push(`lleva ${k.toLowerCase()} fuera de la caja`));
    if(p.observaciones) motivos.push(p.observaciones);
    banner = `<div class="attn-banner"><span class="dot">⚠️</span><span>${motivos.join(' · ')}</span></div>`;
  }

  let doneBanner = '';
  if(entregado){
    const cierre = [...p.entregas].reverse().find(e=>e.tipo==='completa') || p.entregas[p.entregas.length-1];
    doneBanner = `<div class="done-banner"><span class="dot">✅</span><span class="txt">
      Esta OF ya se entregó completa — no hace falta volver a entregar nada.<br>
      <b>${cierre.entregadoPor}</b> se la entregó a <b>${cierre.entregadoA}</b> el ${fechaCorta(cierre.fecha)}.
    </span></div>`;
  }

  let parcialBanner = '';
  if(!entregado && p.entregas.length>0){
    const ultima = [...p.entregas].reverse()[0];
    const { items, notaLimpia } = parsearItemsEntrega(ultima.nota);
    parcialBanner = `<div class="attn-banner"><span class="dot">📦</span><span>
      <b>Entrega parcial ya hecha</b> — ${ultima.entregadoPor} a ${ultima.entregadoA}, ${fechaCorta(ultima.fecha)}.<br>
      ${items.length ? chipsEstadoItems(items)+'<br>' : ''}${notaLimpia || ''}
    </span></div>${resumenSemaforo(p)}`;
  }

  const entregasHtml = p.entregas.length ? `
    <div class="entrega-log">
      ${p.entregas.map((e,i)=>{
        const { items, notaLimpia } = parsearItemsEntrega(e.nota);
        return `<div class="item">
        <b>${e.tipo==='completa' ? 'Entrega completa' : 'Entrega parcial'}</b> — ${fechaCorta(e.fecha)}<br>
        ${e.entregadoPor} entregó a ${e.entregadoA}
        ${items.length ? `<br>${chipsEstadoItems(items)}` : ''}
        ${notaLimpia ? '<br>'+notaLimpia : ''}
        ${puedeGestionar(p) ? `<br><span class="undo" onclick="deshacerEntrega('${p.id}', ${i})">Deshacer esta entrega</span>` : ''}
      </div>`;}).join('')}
    </div>` : '';

  const acciones = p.estado==='completado' ? '' : `
    <button class="btn btn-ok" onclick="entregar('completa')">Entrega completa</button>
    <button class="btn btn-outline" onclick="entregar('parcial')">Entrega parcial</button>
  `;

  const gestionBtns = puedeGestionar(p)
    ? `<button class="btn btn-outline" onclick="abrirEdicion('${p.id}')" style="margin-top:14px;">✏️ Editar datos del picking</button>
       <button class="btn btn-outline" onclick="abrirBorrarPicking('${p.id}')" style="margin-top:8px; color:#B33A3A; border-color:#B33A3A;">🗑️ Borrar este picking</button>`
    : `<div class="hint" style="margin-top:14px;">Solo ${p.registradoPor}, o un administrador, pueden editar o borrar este picking.</div>`;

  return `
    <div class="detail-block">
      <div class="detail-of">OF ${p.of}</div>
      <div class="detail-sub">${p.proyecto || '—'}${p.subproyecto ? ' · '+p.subproyecto : ''}</div>
      <div class="detail-grid">
        <span class="chip">${p.cajas} caja${p.cajas>1?'s':''}</span>
        ${fueraActivas(p).map(k=>`<span class="chip on">${k} fuera</span>`).join('')}
        <span class="status-tag ${entregado?'done':'pend'}">${entregado?'Entregado':'Pendiente'}</span>
      </div>
      ${Object.keys(p.ubicaciones||{}).length ? `<div class="obs-box" style="margin-top:10px;">
        ${Object.entries(p.ubicaciones).map(([k,v])=>`📍 <b>${k==='Cajas' ? 'Cajas de picking ('+p.cajas+')' : k}</b> → ${v}`).join('<br>')}
      </div>` : ''}
      ${p.observaciones ? `<div class="obs-box">${p.observaciones}</div>` : ''}
      <div class="hint" style="margin-top:10px;">Picking registrado por ${p.registradoPor} · ${fechaCorta(p.fecha)}</div>
      ${gestionBtns}
    </div>
    ${doneBanner}
    ${parcialBanner}
    ${banner}
    ${entregasHtml}
    ${historialAdminHtml(p)}
    ${acciones}
  `;
}

function edicionesHtmlOf(p){
  if(!p.ediciones || !p.ediciones.length) return '';
  return `<div class="entrega-log">
    <div style="font-size:12px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.04em;margin-bottom:2px;">Cambios después del registro</div>
    ${p.ediciones.map(e=>`<div class="item">
      <b>Editado por ${e.editadoPor}</b> — ${fechaCorta(e.fecha)}<br>
      ${e.cambios && e.cambios.length ? e.cambios.join(' · ') : 'Guardado sin cambios en los campos'}
      ${e.motivo ? `<br>"${e.motivo}"` : ''}

}
function deshechasHtmlOf(p){
  if(!p.deshechas || !p.deshechas.length) return '';
  return `<div class="entrega-log">
    <div style="font-size:12px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.04em;margin-bottom:2px;">Entregas deshechas</div>
    ${p.deshechas.map(d=>`<div class="item">
      <b>Deshecho por ${d.hechoPor}</b> — ${fechaCorta(d.fecha)}<br>
      ${d.detalleTexto || ''}
      ${d.motivo ? `<br>"${d.motivo}"` : ''}

}
function historialAdminHtml(p){
  if(!esAdminSheet(usuarioActual)) return '';
  const hay = (p.ediciones && p.ediciones.length) || (p.deshechas && p.deshechas.length);
  if(!hay) return '';

    return `<button class="btn btn-outline" onclick="pedirPinAdmin('${p.id}')" style="margin-top:14px;">🔒 Ver historial de cambios</button>`;
  }
  return edicionesHtmlOf(p) + deshechasHtmlOf(p);
}

let entregaItemsEstado = {};

function entregar(tipo){
  const p = DB.find(x=>x.id===ofEnDetalle);
  const nombres = cargarNombres();
  let pillsPor = nombres.map(n=>`<span class="name-pill" data-role="por" onclick="seleccionarPill(this)">${n}</span>`).join('');

  let bloqueItems = '';
  if(tipo==='parcial' && p){
    entregaItemsEstado = {};
    const items = ['Cajas', ...fueraActivas(p)];
    items.forEach(it=> entregaItemsEstado[it] = 'sin');
    bloqueItems = `
    <label>¿Qué incluye esta entrega?</label>
    <div class="hint" style="margin:0 0 10px;">Toca cada ítem para marcar si queda entregado parcial o todo entregado.</div>
    <div id="entregaItemsRow"></div>
    <div id="nuevoComponenteBox" style="display:none; margin-top:10px;">
      <input type="text" id="nuevoComponenteEntrega" placeholder="Nombre del componente">
      <button type="button" class="btn btn-outline" style="margin-top:8px;" onclick="confirmarAnadirComponenteEntrega()">Añadir a la lista</button>
    </div>
    <button type="button" class="check-pill add" style="margin-top:10px; display:inline-block; width:auto; padding:10px 16px;" onclick="mostrarCajaNuevoComponente()">+ Añadir componente</button>`;
  }

  let html = `
    <h3>${tipo==='completa' ? 'Entrega completa' : 'Entrega parcial'}</h3>
    <label>¿Quién entrega?</label>
    <div id="pillsPor">${pillsPor}</div>
    <input type="text" id="entregaPorManual" placeholder="O escribe el nombre">

    <label>¿A quién de DHV se entrega?</label>
    <input type="text" id="entregaA" placeholder="Nombre de la persona de DHV" oninput="actualizarTextoFirma()">

    ${bloqueItems}

    ${tipo==='parcial' ? `<label>Observaciones</label>
    <textarea id="entregaNota" placeholder="Ej. Se llevan 2 perfiles del part number X, quedan 5 por retirar"></textarea>` : ''}

    <div class="sign-banner">
      <label>
        <input type="checkbox" id="confirmFirma" onchange="toggleBtnEntrega()">
        <span>✍️ Confirmo que <b id="signLabelName">la persona de DHV</b> firmará la hoja de picking antes de irme</span>
      </label>
    </div>

    <button class="btn btn-primary" id="btnConfirmarEntrega" onclick="confirmarEntrega('${tipo}')" style="opacity:0.5;">Confirmar entrega</button>
  `;
  mostrarSheet(html);
  if(tipo==='parcial' && p) renderEntregaItems();
}

function renderEntregaItems(){
  const cont = document.getElementById('entregaItemsRow');
  if(!cont) return;
  const cfg = {
    sin:        { texto: '⚪',  etiqueta: 'Sin marcar', clase: '' },
    pendiente:  { texto: '🟠',  etiqueta: 'Entregado parcial', clase: 'item-pend' },
    completado: { texto: '🟢',  etiqueta: 'Todo entregado', clase: 'item-ok' }
  };
  cont.innerHTML = Object.keys(entregaItemsEstado).map(nombre=>{
    const estado = entregaItemsEstado[nombre];
    const c = cfg[estado];
    return `<div class="entrega-item-toggle ${c.clase}" onclick="ciclarEstadoItem('${nombre.replace(/'/g,"\\'")}')">
      <span>${nombre}</span>
      <span class="entrega-item-estado">${c.texto} ${c.etiqueta}</span>
    </div>`;
  }).join('');
}
function ciclarEstadoItem(nombre){
  const orden = ['sin','pendiente','completado'];
  const actual = entregaItemsEstado[nombre] || 'sin';
  entregaItemsEstado[nombre] = orden[(orden.indexOf(actual)+1) % orden.length];
  renderEntregaItems();
}
function mostrarCajaNuevoComponente(){
  const box = document.getElementById('nuevoComponenteBox');
  if(!box) return;
  box.style.display = 'block';
  const input = document.getElementById('nuevoComponenteEntrega');
  if(input) input.focus();
}
function confirmarAnadirComponenteEntrega(){
  const input = document.getElementById('nuevoComponenteEntrega');
  const val = input.value.trim();
  if(!val) return;
  entregaItemsEstado[val] = 'pendiente';
  input.value = '';
  document.getElementById('nuevoComponenteBox').style.display = 'none';
  renderEntregaItems();
}

function toggleBtnEntrega(){
  const chk = document.getElementById('confirmFirma');
  const btn = document.getElementById('btnConfirmarEntrega');
  if(chk && btn) btn.style.opacity = chk.checked ? '1' : '0.5';
}
function actualizarTextoFirma(){
  const nombre = document.getElementById('entregaA').value.trim();
  const span = document.getElementById('signLabelName');
  if(span) span.textContent = nombre || 'la persona de DHV';
}

function seleccionarPill(el){
  document.querySelectorAll('#pillsPor .name-pill').forEach(p=>p.classList.remove('sel'));
  el.classList.add('sel');
  document.getElementById('entregaPorManual').value = el.textContent;
}

async function confirmarEntrega(tipo){
  try{
    const p = DB.find(x=>x.id===ofEnDetalle);
    if(!p){ toast('No se encontró la OF, vuelve a abrirla'); return; }
    const por = document.getElementById('entregaPorManual').value.trim() || usuarioActual;
    const a = document.getElementById('entregaA').value.trim();
    let nota = tipo==='parcial' ? document.getElementById('entregaNota').value.trim() : '';
    const firmaConfirmada = document.getElementById('confirmFirma').checked;

    if(!por){ toast('Falta quién entrega'); return; }
    if(!a){ toast('Falta a quién se entrega'); return; }
    if(!firmaConfirmada){ toast('Confirma que va a firmar la hoja de picking'); return; }

    let items = [];
    if(tipo==='parcial'){
      items = Object.entries(entregaItemsEstado).filter(([,estado])=>estado!=='sin');
      if(!nota && items.length===0){ toast('Marca qué se lleva o escribe una observación'); return; }
    }

    if(items.length) nota = `[${items.map(([n,e])=>`${n}:${e}`).join('|')}] ${nota}`;

    const entregaLocal = { tipo, entregadoPor: por, entregadoA: a, nota, fecha: new Date().toISOString() };
    p.entregas.push(entregaLocal);
    if(tipo==='completa') p.estado = 'completado';

    cerrarSheet();
    toast('Entrega registrada — recuerda la firma en la hoja');
    abrirDetalle(p.id);

    try{
      const resultado = await llamarBackend('entregar', { pickingId: p.id, tipo, entregadoPor: por, entregadoA: a, nota });
      if(resultado && resultado.ok === false){
        toast('⚠️ ' + (resultado.error || 'No se pudo confirmar la entrega — revisando'));
      }
    } catch(err){}
    sincronizar().catch(()=>{});
  } catch(errGeneral){
    toast('Algo falló al confirmar — inténtalo de nuevo');
  }
}

function deshacerEntrega(pid, idx){
  const p = DB.find(x=>x.id===pid);
  if(!p) return;
  if(!puedeGestionar(p)){ toast('Solo quien registró este picking, o un administrador, pueden deshacer su entrega'); return; }
  pendienteDeshacer = { pid, idx };
  mostrarSheet(`
    <h3>¿Deshacer esta entrega?</h3>
    <p style="font-size:14px; color:var(--ink-soft); margin:0 0 10px;">
      Se borra este registro de entrega. Si era la entrega completa, la OF vuelve a quedar pendiente.
    </p>
    <label>¿Por qué se deshace?</label>
    <textarea id="motivoDeshacer" placeholder="Ej. Me dijeron que se lo llevaban y al final no fue así"></textarea>
    <button class="btn btn-primary" id="btnConfirmarDeshacer" onclick="confirmarDeshacerEntrega()">Sí, deshacer</button>
    <button class="btn btn-outline" onclick="cerrarSheet()">Cancelar</button>
  `);
}
async function confirmarDeshacerEntrega(){
  if(!pendienteDeshacer) return;
  const { pid, idx } = pendienteDeshacer;
  const p = DB.find(x=>x.id===pid);
  if(!p) return;
  const motivo = document.getElementById('motivoDeshacer').value.trim();
  if(!motivo){ toast('Escribe el motivo'); return; }

  const eliminada = p.entregas[idx];
  if(!eliminada) return;

  p.entregas.splice(idx, 1);
  if(eliminada.tipo==='completa') p.estado = 'pendiente';
  if(!p.deshechas) p.deshechas = [];
  p.deshechas.push({
    hechoPor: usuarioActual,
    fecha: new Date().toISOString(),
    motivo,
    detalleTexto: `Era: ${eliminada.tipo==='completa' ? 'entrega completa' : 'entrega parcial'} de ${eliminada.entregadoPor} a ${eliminada.entregadoA}`
  });

  cerrarSheet();
  pendienteDeshacer = null;
  toast('Entrega deshecha');
  abrirDetalle(p.id);

  try{
    const resultado = await llamarBackend('deshacerEntrega', {
      pickingId: pid,
      tipoOriginal: eliminada.tipo,
      fechaOriginal: eliminada.fecha,
      hechoPor: usuarioActual,
      motivo
    });
    if(resultado && resultado.ok === false){
      toast('⚠️ ' + (resultado.error || 'No se pudo deshacer — revisando'));
    }
  } catch(err){}
  sincronizar().catch(()=>{});
}

function abrirBorrarPicking(id){
  const p = DB.find(x=>x.id===id);
  if(!p) return;
  if(!puedeGestionar(p)){ toast('Solo quien registró este picking, o un administrador, pueden borrarlo'); return; }
  mostrarSheet(`
    <h3>¿Borrar este picking?</h3>
    <p style="font-size:14px; color:var(--ink-soft); margin:0 0 10px;">
      Se borra de verdad: desaparece de la app para todo el mundo. Queda una copia con el motivo en la hoja "Eliminados" del Excel, por si hace falta consultarla ahí.
    </p>
    <label>¿Por qué se borra?</label>
    <textarea id="motivoBorrado" placeholder="Ej. Se registró por error, era otra OF"></textarea>
    <button class="btn btn-primary" id="btnConfirmarBorrar" style="background:#B33A3A;" onclick="confirmarBorrarPicking('${id}')">Sí, borrar</button>
    <button class="btn btn-outline" onclick="cerrarSheet()">Cancelar</button>
  `);
}
async function confirmarBorrarPicking(id){
  const p = DB.find(x=>x.id===id);
  if(!p) return;
  if(!puedeGestionar(p)){ toast('No tienes permiso para borrar este picking'); return; }
  const motivo = document.getElementById('motivoBorrado').value.trim();
  if(!motivo){ toast('Escribe el motivo'); return; }

  // se quita de verdad de la app al instante (no solo se marca)
  DB = DB.filter(x=>x.id!==id);

  cerrarSheet();
  toast('Picking eliminado');
  ir('home');

  try{
    await llamarBackend('borrarPicking', { id, motivo, por: usuarioActual });
  } catch(err){}
  sincronizar().catch(()=>{});
}

/* ---------- init ---------- */
async function iniciar(){
  actualizarChipUsuario();

  // Inicio ya no depende de ningún dato: se ve al instante siempre.
  // Solo esperamos a tener datos si hace falta mostrar la pantalla de
  // identificación (necesita saber qué usuarios existen ya).
  if(!usuarioActual){
    try{ await sincronizar(); } catch(err){}
    setTimeout(()=>abrirCambioUsuario(true), 300);
  } else {
    sincronizar().catch(()=>{});
  }

  // Refresco en segundo plano: para que lo que otra persona borre o cambie
  // directamente en la Sheet (fuera de la app) se refleje sin tener que
  // hacer nada. No interrumpe si hay un formulario o ventana abiertos.
  setInterval(()=>{
    if(document.getElementById('sheetOverlay')) return;
    if(document.querySelector('.screen.active')?.id === 'screen-registro') return;
    sincronizar().catch(()=>{});
  }, 20000);
  document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState === 'visible'){ sincronizar().catch(()=>{}); }
  });
}
iniciar();
</script>
